plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }

// =====================================================================================
// ★ Q 弹版构建开关：gradlew build -Pqmode=true
//   · 普通版：mod id = hexalunar_calamity   、显示名「六相月灾」
//   · Q 弹版：mod id = hexalunar_calamity_q 、显示名「六相月灾 · Q弹版」
//   两个 jar 可以同时装（id 不同互不冲突）；代码只有这一份，差别全在这里 + src/qresources 覆盖层
// =====================================================================================
def qmode = project.hasProperty('qmode') && project.property('qmode').toString().equalsIgnoreCase('true')
def baseNs = 'hexalunar_calamity'
def modId = qmode ? 'hexalunar_calamity_q' : baseNs
def modName = qmode ? '六相月灾 · Q弹版' : '六相月灾'

// ★★ 这一行必须保持「行首 + version = '单引号'」的写法，**不要**改成
//    `version = qmode ? '…' : '…'`：CI 的 release 作业是用
//    `sed -n "s/^version = '\(.*\)'/\1/p" mod/build.gradle` 读版本号来打 tag 的
//    （见 .github/workflows/build.yml）。写成三目之后 sed 匹配不到，VERSION 为空，
//    release 作业会直接 `exit 1` 失败（jar 照样构建成功，但不会打 tag / 发 Release）。
//    Q 弹版的版本号在这行之后覆盖，两种构建的产物名与以前完全一致。
version = '1.0.0-r118'
if (qmode) {
    version = '1.0.0-q3'
}
group = 'cn.blockforge.generated.hexalunarcalamity'
base { archivesName = modId }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'

    // FG6 不会自动生成运行任务，要显式声明；这样 gradlew runClient 才能起开发客户端
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${modId}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // GeckoLib 官方 maven（动画/骨骼模型库）
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // 4.8.x 是 1.20.1 Forge 的配套版本：geo/animation 都能直接用 Blockbench GeckoLib 插件导出
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// -------------------------------------------------------------------------------------
// 1) 构建期生成 BuildInfo.java：把 mod id 与 Q 弹开关烘进代码（javac 会把它常量折叠，
//    所以非 Q 版编译出来的字节码里 Q 分支会被直接去掉）
// -------------------------------------------------------------------------------------
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo').get().asFile
tasks.register('generateBuildInfo') {
    def outDir = buildInfoDir
    def theId = modId
    def q = qmode
    outputs.dir(outDir)
    // ★ 必须声明成输入：否则 -Pqmode 切换时 Gradle 会以为「没变」而跳过重生成，
    //   jar 里的 mod id 就会和 mods.toml 对不上
    inputs.property('modId', modId)
    inputs.property('qmode', qmode)
    doLast {
        def pkg = new File(outDir, 'cn/blockforge/generated/hexalunarcalamity')
        pkg.mkdirs()
        new File(pkg, 'BuildInfo.java').setText("""package cn.blockforge.generated.hexalunarcalamity;

/** 构建期生成（见 build.gradle 的 -Pqmode），不要手改。 */
public final class BuildInfo {
    /** 本 jar 的 mod id：hexalunar_calamity（普通版）/ hexalunar_calamity_q（Q 弹版） */
    public static final String MOD_ID = "${theId}";
    /** 是否 Q 弹版：Q 版造型 + 果冻晃动（javac 常量折叠，非 Q 版里这些分支不存在） */
    public static final boolean Q_MODE = ${q};

    private BuildInfo() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir buildInfoDir
compileJava.dependsOn generateBuildInfo

// -------------------------------------------------------------------------------------
// 2) Q 弹版资源树：把基础命名空间整体搬成 Q 命名空间，再叠上 src/qresources 的 Q 版文件
//    （两个 jar 不能同时提供 assets/hexalunar_calamity/** 这种同路径资源，否则会互相抢）
// -------------------------------------------------------------------------------------
def qresDir = layout.buildDirectory.dir('qresources').get().asFile
tasks.register('prepareQResources') {
    def srcRes = file('src/main/resources')
    def overlay = file('src/qresources')
    def theId = modId
    inputs.dir(srcRes)
    inputs.dir(overlay)
    outputs.dir(qresDir)
    doLast {
        delete qresDir
        qresDir.mkdirs()
        // a) 不带命名空间的部分：原样（方块图集 / mods.toml / pack.mcmeta）
        copy {
            from(new File(srcRes, 'assets/minecraft')) { into 'assets/minecraft' }
            from(new File(srcRes, 'META-INF')) { into 'META-INF' }
            from(new File(srcRes, 'pack.mcmeta')) { into '.' }
            into qresDir
        }
        // b) 我们自己的命名空间 → Q 命名空间（data/forge 里的战利品 id 也要一起改）
        copy {
            from(new File(srcRes, 'assets/' + baseNs)) { into 'assets/' + theId }
            from(new File(srcRes, 'data/' + baseNs)) { into 'data/' + theId }
            from(new File(srcRes, 'data/forge')) { into 'data/forge' }
            into qresDir
        }
        // ★ 命名空间替换：**json / mtl / obj 都要换**。
        //   踩过的坑（2026-09-20 用户日志）：原来只 include '**/*.json' ⇒ `.mtl` 里
        //   `map_Kd hexalunar_calamity:models/crossbow` 仍指向**基础命名空间**，
        //   而 Q 版里 `assets/hexalunar_calamity/**` 已经不存在了 ⇒ 客户端启动时刷
        //   `Missing textures in model hexalunar_calamity_q:item/crossbow_hand_part:
        //    minecraft:textures/atlas/blocks.png:hexalunar_calamity:models/crossbow`
        //   （两条：crossbow_hand_part / crossbow_bolt_part）。
        //   OBJ 里的 `mtllib` 是相对文件名，不受影响；顶点数据里也不含命名空间。
        fileTree(qresDir).matching { include '**/*.json', '**/*.mtl', '**/*.obj' }.each { f ->
            def t = f.getText('UTF-8')
            if (t.contains(baseNs)) f.setText(t.replace(baseNs, theId), 'UTF-8')
        }
        // ★ 创造页签的显示名跟着改名（键已经被换成 Q 命名空间，这里只改值）
        [['zh_cn.json', '六相月灾', '六相月灾 · Q弹版'],
         ['en_us.json', 'Hexa Lunar Calamity', 'Hexa Lunar Calamity · Bouncy']].each { lang ->
            def f = new File(qresDir, "assets/${theId}/lang/${lang[0]}")
            if (f.exists()) {
                f.setText(f.getText('UTF-8')
                        .replace("\"itemGroup.${theId}\": \"${lang[1]}\"",
                                 "\"itemGroup.${theId}\": \"${lang[2]}\""), 'UTF-8')
            }
        }
        // c) Q 版覆盖层（同路径覆盖：Q 版模型 / 贴图 / 语言）
        copy {
            from(overlay) { into '.' }
            into qresDir
        }
    }
}

processResources {
    def props = [mod_id: modId, mod_name: modName, mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0', geckolib_version: '4.8.4']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
    if (qmode) {
        dependsOn tasks.named('prepareQResources')
        // ★ 直接用 Q 资源树**替换**默认资源目录。
        //   注意别用 `exclude 'assets/**'`：CopySpec 的 exclude 会把 `from()` 加进来的内容
        //   一起排掉 ⇒ processResources 变成 NO-SOURCE、jar 里一个资源都没有。
        sourceSets.main.resources.setSrcDirs([qresDir])
    }
}
jar.finalizedBy('reobfJar')
